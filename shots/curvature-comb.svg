<text class="t" x="104" y="42">Panoramic P1 · curvature comb across one seam</text>
<text class="s" x="104" y="66">cell#55 | cell#63 on curve#36 — normal curvature along a path crossing the shared curve</text>
<text class="s" x="104" y="86">read from three sampled positions at a time — never from the derivative the correction was built against</text>
<text class="ax accent" x="609.5" y="132">the seam</text>

